name: Deploy MUTAGENÊSES to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Recover valid application bundle from segment history
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const vm = require('node:vm');

          const names = Array.from({length: 8}, (_, i) => `app-segment-${String(i + 1).padStart(2, '0')}.txt`);
          const commits = execFileSync('git', ['log', '--format=%H', '--', ...names], {encoding: 'utf8'})
            .trim().split(/\s+/).filter(Boolean);

          function readAt(commit, file) {
            try { return execFileSync('git', ['show', `${commit}:${file}`], {encoding: 'utf8'}); }
            catch { return null; }
          }

          function clean(text) {
            return String(text ?? '')
              .replace(/^\uFEFF/, '')
              .replace(/[\s\u200B\u200C\u200D]/g, '')
              .replace(/-/g, '+')
              .replace(/_/g, '/');
          }

          function decode(text) {
            let s = clean(text);
            if (!s || !/^[A-Za-z0-9+/]*={0,2}$/.test(s) || s.length % 4 === 1) return null;
            if (s.length % 4) s += '='.repeat(4 - (s.length % 4));
            try { return Buffer.from(s, 'base64'); } catch { return null; }
          }

          function tryBundle(parts) {
            const decoded = parts.map(decode);
            if (decoded.some(x => !x)) return null;
            const sources = [];
            for (const raw of decoded) {
              if (raw.length < 2 || raw[0] !== 0x1f || raw[1] !== 0x8b) return null;
              try { sources.push(zlib.gunzipSync(raw).toString('utf8')); }
              catch { return null; }
            }
            const core = sources.join('');
            if (!core.trim()) return null;
            try { new vm.Script(core, {filename: 'mutageneses-core.js'}); }
            catch { return null; }
            return {core, bytes: decoded.reduce((n, b) => n + b.length, 0)};
          }

          let found = null;
          for (const commit of commits) {
            const parts = names.map(name => readAt(commit, name));
            if (parts.some(x => x === null)) continue;
            const candidate = tryBundle(parts);
            if (candidate) {
              found = {commit, ...candidate};
              break;
            }
          }

          if (!found) {
            throw new Error('Nenhum conjunto histórico de app-segment-01..08 produz um bundle GZIP válido.');
          }

          console.log(`FOUND valid payload at ${found.commit}; ${found.core.length} caracteres JS; ${found.bytes} bytes GZIP.`);
          const cloud = fs.readFileSync('cloud-boot.js', 'utf8');
          const bundle = `${found.core}\n;\n${cloud}`;
          new vm.Script(bundle, {filename: 'app.bundle.js'});
          fs.writeFileSync('app.bundle.js', bundle, 'utf8');
          fs.writeFileSync('.found-payload-commit', found.commit, 'utf8');
          console.log('PASS: app.bundle.js reconstruído e validado.');
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
