name: Deploy MUTAGENÊSES to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Diagnose and verify application bundle
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const vm = require('node:vm');

          const files = Array.from({length: 8}, (_, i) =>
            `app-part-${String(i + 1).padStart(2, '0')}.txt`
          );

          function clean(text) {
            return String(text ?? '')
              .replace(/^\uFEFF/, '')
              .replace(/[\s\u200B\u200C\u200D]/g, '')
              .replace(/-/g, '+')
              .replace(/_/g, '/')
              .replace(/=/g, '');
          }

          const parts = files.map(file => clean(fs.readFileSync(file, 'utf8')));
          if (parts.some(s => !s || !/^[A-Za-z0-9+/]*$/.test(s))) {
            throw new Error('Fragmentos app-part contêm caracteres Base64 inválidos.');
          }

          function tryJoined(order) {
            const merged = order.map(i => parts[i]).join('');
            if (merged.length % 4 === 1) return null;
            const padded = merged + '='.repeat((4 - (merged.length % 4)) % 4);
            try {
              const raw = Buffer.from(padded, 'base64');
              if (raw.length < 2 || raw[0] !== 0x1f || raw[1] !== 0x8b) return null;
              const source = zlib.gunzipSync(raw).toString('utf8');
              if (!source.trim()) return null;
              new vm.Script(source);
              return {order, source, raw};
            } catch {
              return null;
            }
          }

          function permutations(items) {
            const out = [];
            function rec(prefix, rest) {
              if (rest.length === 0) { out.push(prefix); return; }
              for (let i = 0; i < rest.length; i++) {
                rec(prefix.concat(rest[i]), rest.slice(0, i).concat(rest.slice(i + 1)));
              }
            }
            rec([], items);
            return out;
          }

          // Testa a ordem nominal e, para diagnóstico, todas as 8! permutações.
          let found = tryJoined([0,1,2,3,4,5,6,7]);
          if (!found) {
            for (const order of permutations([0,1,2,3,4,5,6,7])) {
              found = tryJoined(order);
              if (found) break;
            }
          }

          if (!found) {
            throw new Error('Nenhuma ordem dos 8 app-part produz um GZIP válido. Payload está corrompido/incompatível.');
          }

          console.log(`PASS: bundle íntegro; ordem=${found.order.map(i => i + 1).join('-')}; ${found.source.length} caracteres; ${found.raw.length} bytes GZIP.`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
