name: Deploy MUTAGENÊSES to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify application bundle
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const vm = require('node:vm');

          const files = Array.from({length: 8}, (_, i) =>
            `app-segment-${String(i + 1).padStart(2, '0')}.txt`
          );

          function cleanPart(text) {
            const s = String(text ?? '')
              .replace(/^\uFEFF/, '')
              .replace(/[\s\u200B\u200C\u200D]/g, '')
              .replace(/-/g, '+')
              .replace(/_/g, '/')
              .replace(/=/g, '');
            if (!s || !/^[A-Za-z0-9+/]*$/.test(s)) {
              throw new Error('Fragmento Base64 inválido.');
            }
            return s;
          }

          const parts = files.map(file => cleanPart(fs.readFileSync(file, 'utf8')));
          const merged = parts.join('');

          if (merged.length % 4 === 1) {
            throw new Error(`Fluxo Base64 inválido: comprimento ${merged.length}.`);
          }

          const padded = merged + '='.repeat((4 - (merged.length % 4)) % 4);
          const raw = Buffer.from(padded, 'base64');

          if (raw.length < 2 || raw[0] !== 0x1f || raw[1] !== 0x8b) {
            throw new Error('Fluxo GZIP inválido.');
          }

          const source = zlib.gunzipSync(raw).toString('utf8');
          if (!source.trim()) throw new Error('Aplicação vazia.');
          new vm.Script(source, { filename: 'mutageneses-app-bundle.js' });

          console.log(`PASS: bundle íntegro; ${source.length} caracteres; ${merged.length} caracteres Base64.`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
