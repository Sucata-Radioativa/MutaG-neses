name: Deploy MUTAGENÊSES to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Recover and build application from a valid historical payload
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const vm = require('node:vm');

          const names = Array.from({length: 8}, (_, i) => `app-part-${String(i + 1).padStart(2, '0')}.txt`);
          const commits = execFileSync('git', ['log', '--format=%H', '--', ...names], {encoding: 'utf8'})
            .trim().split(/\s+/).filter(Boolean);

          function readAt(commit, file) {
            try {
              return execFileSync('git', ['show', `${commit}:${file}`], {encoding: 'utf8'});
            } catch {
              return null;
            }
          }

          function clean(text) {
            return String(text ?? '')
              .replace(/^\uFEFF/, '')
              .replace(/[\s\u200B\u200C\u200D]/g, '')
              .replace(/-/g, '+')
              .replace(/_/g, '/');
          }

          function decodePart(text) {
            let s = clean(text);
            if (!s || !/^[A-Za-z0-9+/]*={0,2}$/.test(s) || s.length % 4 === 1) return null;
            if (s.length % 4) s += '='.repeat(4 - (s.length % 4));
            try { return Buffer.from(s, 'base64'); } catch { return null; }
          }

          function tryDecodedIndividually(parts) {
            const decoded = parts.map(decodePart);
            if (decoded.some(x => !x)) return null;
            const raw = Buffer.concat(decoded);
            if (raw.length < 2 || raw[0] !== 0x1f || raw[1] !== 0x8b) return null;
            try {
              const core = zlib.gunzipSync(raw).toString('utf8');
              if (!core.trim()) return null;
              new vm.Script(core);
              return {mode: 'per-part', core, raw};
            } catch { return null; }
          }

          function tryMergedBase64(parts) {
            let merged = parts.map(clean).join('');
            if (!merged || !/^[A-Za-z0-9+/]*={0,2}$/.test(merged) || merged.length % 4 === 1) return null;
            if (merged.length % 4) merged += '='.repeat(4 - (merged.length % 4));
            const raw = Buffer.from(merged, 'base64');
            if (raw.length < 2 || raw[0] !== 0x1f || raw[1] !== 0x8b) return null;
            try {
              const core = zlib.gunzipSync(raw).toString('utf8');
              if (!core.trim()) return null;
              new vm.Script(core);
              return {mode: 'merged', core, raw};
            } catch { return null; }
          }

          let found = null;
          for (const commit of commits) {
            const parts = names.map(name => readAt(commit, name));
            if (parts.some(x => x === null)) continue;
            found = tryDecodedIndividually(parts) || tryMergedBase64(parts);
            if (found) {
              console.log(`FOUND valid payload at ${commit} using ${found.mode}.`);
              fs.writeFileSync('.found-payload-commit', commit, 'utf8');
              fs.writeFileSync('app.bundle.js', found.core + '\n;\n' + fs.readFileSync('cloud-boot.js', 'utf8'), 'utf8');
              new vm.Script(fs.readFileSync('app.bundle.js', 'utf8'), {filename: 'app.bundle.js'});
              console.log(`PASS: app.bundle.js valid; ${found.core.length} core chars; ${found.raw.length} gzip bytes.`);
              break;
            }
          }

          if (!found) {
            throw new Error('Nenhuma versão histórica de app-part-01..08 produz um GZIP válido.');
          }
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
