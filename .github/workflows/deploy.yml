name: Deploy MUTAGENÊSES to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore known-good application segments
        run: |
          set -euo pipefail
          cat _pristine/seg01-1.txt _pristine/seg01-2.txt _pristine/seg01-3.txt > app-segment-01.txt
          cat _pristine/seg05-1.txt _pristine/seg05-2.txt _pristine/seg05-3.txt > app-segment-05.txt
          cat _pristine/seg08-1.txt _pristine/seg08-2.txt _pristine/seg08-3.txt > app-segment-08.txt

      - name: Build and verify application bundle
        run: node build-app.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
