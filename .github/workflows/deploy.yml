name: Deploy MUTAGENÊSES to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan dangling Git objects for lost application blobs
        run: |
          set -euo pipefail
          git fsck --full --unreachable --no-reflogs --no-progress > /tmp/fsck.txt || true
          echo '=== UNREACHABLE LARGE BLOBS ==='
          while read -r state type sha; do
            [ "$state" = unreachable ] || [ "$state" = dangling ] || continue
            [ "$type" = blob ] || continue
            size=$(git cat-file -s "$sha" 2>/dev/null || echo 0)
            if [ "$size" -ge 4000 ]; then
              echo "$sha size=$size"
              git cat-file blob "$sha" | head -c 100 | od -An -tx1c || true
            fi
          done < /tmp/fsck.txt
          echo '=== END FSCK ==='

      - name: Restore valid historical gzip segments
        run: |
          set -euo pipefail
          git show 6e54e3535675c2d1714e0fa868e2ebebe54662f2:app-segment-02.txt > app-segment-02.txt
          git show 6f62e41f5dc96566e614404c6c22562f1d9b35f0:app-segment-03.txt > app-segment-03.txt
          git show 263e2ec8051f1f82e9b59f0f1f68747358f64572:app-segment-04.txt > app-segment-04.txt
          git show bf6225a5da1c79cf808b743f6a63e455f9b15968:app-segment-05.txt > app-segment-05.txt
          git show 4dce965786b73099edce40b7fdf6312fdc60015a:app-segment-06.txt > app-segment-06.txt
          git show 78d283ff061ba4da5d7b7a59ea624c5f3cfcbaf3:app-segment-07.txt > app-segment-07.txt

      - name: Install gzip recovery toolkit
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/arenn/gzrt/master/gzrecover.c -o /tmp/gzrecover.c
          gcc -O2 -o /tmp/gzrecover /tmp/gzrecover.c -lz
          /tmp/gzrecover -V

      - name: Decode and recover damaged segments
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const names=['01','02','03','04','05','06','07','08'];
          for(const n of names){
            let s=fs.readFileSync(`app-segment-${n}.txt`,'utf8').replace(/^\uFEFF/,'').replace(/[\s\u200B\u200C\u200D]/g,'').replace(/-/g,'+').replace(/_/g,'/').replace(/=/g,'');
            if(!s || !/^[A-Za-z0-9+/]*$/.test(s) || s.length%4===1) throw new Error(`segment ${n}: invalid base64 length ${s.length}`);
            s+='='.repeat((4-s.length%4)%4);
            fs.writeFileSync(`/tmp/seg${n}.gz`,Buffer.from(s,'base64'));
          }
          NODE

          /tmp/gzrecover -p -v /tmp/seg01.gz > /tmp/seg01.recovered.js 2> /tmp/seg01.recovery.log || true
          /tmp/gzrecover -p -v /tmp/seg08.gz > /tmp/seg08.recovered.js 2> /tmp/seg08.recovery.log || true

          node <<'NODE'
          const fs=require('node:fs');
          const zlib=require('node:zlib');
          const vm=require('node:vm');
          const valid=[];
          for(let i=2;i<=7;i++) valid.push(zlib.gunzipSync(fs.readFileSync(`/tmp/seg${String(i).padStart(2,'0')}.gz`)).toString('utf8'));
          const r1=fs.readFileSync('/tmp/seg01.recovered.js','utf8');
          const r8=fs.readFileSync('/tmp/seg08.recovered.js','utf8');
          console.log(`recovered seg01=${r1.length} seg08=${r8.length}`);
          console.log('--- seg01 recovery log ---');
          console.log(fs.readFileSync('/tmp/seg01.recovery.log','utf8'));
          console.log('--- seg08 recovery log ---');
          console.log(fs.readFileSync('/tmp/seg08.recovery.log','utf8'));
          const full=r1+valid.join('')+r8;
          try{
            new vm.Script(full,{filename:'mutageneses-recovered.js'});
            fs.writeFileSync('app-core.js',full,'utf8');
            console.log(`PASS NATURAL RECOVERY: ${full.length} chars`);
          }catch(e){
            console.log(`Natural reconstruction parse: ${e.message}`);
            fs.writeFileSync('recovery-seg01.js',r1,'utf8');
            fs.writeFileSync('recovery-seg08.js',r8,'utf8');
            process.exit(2);
          }
          NODE

      - name: Verify recovered app
        run: |
          set -euo pipefail
          node --check app-core.js
          test "$(wc -c < app-core.js)" -gt 100000
          echo "PASS: recovered application source is syntactically valid"

      - name: Install direct application loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<script src="app.js"></script>','<script src="app-core.js"></script>\n  <script src="cloud-boot.js"></script>')
          p.write_text(s)
          Path('app.js').write_text('// Compatibility placeholder; index.html loads app-core.js directly.\n')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
