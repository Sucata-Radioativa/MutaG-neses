name: Deploy MUTAGENÊSES to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify application bundle
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const vm = require('node:vm');

          const files = Array.from({length: 8}, (_, i) =>
            `app-part-${String(i + 1).padStart(2, '0')}.txt`
          );

          function clean(text) {
            return String(text ?? '')
              .replace(/^\uFEFF/, '')
              .replace(/[\s\u200B\u200C\u200D]/g, '')
              .replace(/-/g, '+')
              .replace(/_/g, '/');
          }

          function decode(text, file) {
            let s = clean(text);
            if (!s || !/^[A-Za-z0-9+/]*={0,2}$/.test(s) || s.length % 4 === 1) {
              throw new Error(`Fragmento Base64 inválido: ${file} length=${s.length}`);
            }
            if (s.length % 4) s += '='.repeat(4 - (s.length % 4));
            return Buffer.from(s, 'base64');
          }

          // app-part-* são Base64 independentes de blocos de bytes do mesmo GZIP.
          const chunks = files.map(file => decode(fs.readFileSync(file, 'utf8'), file));
          const raw = Buffer.concat(chunks);

          if (raw.length < 2 || raw[0] !== 0x1f || raw[1] !== 0x8b) {
            throw new Error('Pacote GZIP inválido.');
          }

          const source = zlib.gunzipSync(raw).toString('utf8');
          if (!source.trim()) throw new Error('Aplicação vazia.');
          new vm.Script(source, { filename: 'mutageneses-app-bundle.js' });

          console.log(`PASS: bundle íntegro; ${source.length} caracteres; ${raw.length} bytes GZIP.`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
