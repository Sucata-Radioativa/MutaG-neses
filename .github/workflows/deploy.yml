name: Deploy MUTAGENÊSES to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore exact original application parts
        run: |
          set -euo pipefail
          git show 6900339e3fa41fc06f46567da2b9e2963b8b6507:app-part-01.txt > app-part-01.txt
          git show f9990d52817b0e0cae2f1b534b94bc5ef15a95a6:app-part-02.txt > app-part-02.txt
          git show c7ccd9e2cd2349b99f0fbc905b276d84f9f39996:app-part-03.txt > app-part-03.txt
          git show 457db1ea7d82199ed73d68ac5ff536995fff8aee:app-part-04.txt > app-part-04.txt
          git show 24934ad901f2a8536e85ab005f695e0f8ac7bc76:app-part-05.txt > app-part-05.txt
          git show 99036256a9277a798f05c5f1f25b074848448148:app-part-06.txt > app-part-06.txt
          git show 54467ebfe0efec6588f6faa63f60f25f0d565a08:app-part-07.txt > app-part-07.txt
          git show e370e02d5a8c9f2afc63e711e33acfc3cbfbecc1:app-part-08.txt > app-part-08.txt

      - name: Validate application payload
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const vm = require('node:vm');

          const files = Array.from({length: 8}, (_, i) =>
            `app-part-${String(i + 1).padStart(2, '0')}.txt`
          );
          const b64 = files.map(f => fs.readFileSync(f, 'utf8').replace(/^\uFEFF/, '').replace(/[\s\u200B\u200C\u200D]/g, '')).join('');

          if (!b64 || b64.length % 4 === 1) {
            throw new Error(`Base64 final inválido: comprimento=${b64.length}`);
          }

          const raw = Buffer.from(b64, 'base64');
          if (raw.length < 2 || raw[0] !== 0x1f || raw[1] !== 0x8b) {
            throw new Error(`GZIP inválido: assinatura=${raw.subarray(0, 4).toString('hex')}`);
          }

          const source = zlib.gunzipSync(raw).toString('utf8');
          if (!source.trim()) throw new Error('Aplicação vazia.');
          new vm.Script(source, {filename: 'mutageneses-app.js'});
          console.log(`PASS: payload original íntegro; ${b64.length} Base64 chars; ${raw.length} gzip bytes; ${source.length} JS chars.`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
