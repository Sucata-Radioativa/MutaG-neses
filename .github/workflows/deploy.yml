name: Deploy MUTAGENÊSES to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore known-good application segments
        run: |
          set -euo pipefail
          cat _pristine/seg01-1.txt _pristine/seg01-2.txt _pristine/seg01-3.txt > app-segment-01.txt
          cat _pristine/seg05-1.txt _pristine/seg05-2.txt _pristine/seg05-3.txt > app-segment-05.txt
          cat _pristine/seg08-1.txt _pristine/seg08-2.txt _pristine/seg08-3.txt > app-segment-08.txt

      - name: Rebuild application bundle from merged Base64 stream
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const vm = require('node:vm');

          const files = Array.from({length: 8}, (_, i) =>
            `app-segment-${String(i + 1).padStart(2, '0')}.txt`
          );

          function clean(text) {
            return String(text ?? '')
              .replace(/^\uFEFF/, '')
              .replace(/[\s\u200B\u200C\u200D]/g, '')
              .replace(/-/g, '+')
              .replace(/_/g, '/')
              .replace(/=/g, '');
          }

          const merged = files.map(file => clean(fs.readFileSync(file, 'utf8'))).join('');
          if (!merged || merged.length % 4 === 1) {
            throw new Error(`Base64 final inválido: comprimento=${merged.length}`);
          }

          const padded = merged + '='.repeat((4 - (merged.length % 4)) % 4);
          const raw = Buffer.from(padded, 'base64');
          if (raw.length < 2 || raw[0] !== 0x1f || raw[1] !== 0x8b) {
            throw new Error(`GZIP inválido: assinatura=${raw.subarray(0, 4).toString('hex')}`);
          }

          const bundle = zlib.gunzipSync(raw).toString('utf8');
          if (!bundle.trim()) throw new Error('Bundle vazio.');
          new vm.Script(bundle, {filename: 'mutageneses-app.bundle.js'});
          fs.writeFileSync('app.bundle.js', bundle, 'utf8');
          console.log(`PASS: bundle reconstruído e validado; ${bundle.length} caracteres JS; ${raw.length} bytes GZIP.`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
