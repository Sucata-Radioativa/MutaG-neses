name: Recover damaged deflate members

on:
  push:
    branches: [recovery/diagnose-segments]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zlib-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build zlib recovery mode
        run: |
          set -euo pipefail
          curl -fsSL https://zlib.net/zlib-1.3.1.tar.gz -o /tmp/zlib.tar.gz
          tar -xzf /tmp/zlib.tar.gz -C /tmp
          cd /tmp/zlib-1.3.1
          CFLAGS='-O2 -DINFLATE_ALLOW_INVALID_DISTANCE_TOOFAR_ARRR' ./configure --static >/tmp/zlib-config.log
          make -j2 >/tmp/zlib-make.log
          cat > /tmp/recover_gz.c <<'C'
          #include <stdio.h>
          #include <zlib.h>
          int main(int argc,char**argv){
            if(argc!=3)return 2;
            gzFile in=gzopen(argv[1],"rb"); if(!in)return 3;
            FILE*out=fopen(argv[2],"wb"); if(!out)return 4;
            unsigned char buf[65536]; int n,total=0;
            while((n=gzread(in,buf,sizeof(buf)))>0){fwrite(buf,1,n,out);total+=n;}
            int err=0; const char*msg=gzerror(in,&err);
            fprintf(stderr,"gzread total=%d err=%d msg=%s\n",total,err,msg?msg:"");
            gzclose(in);fclose(out);return 0;
          }
          C
          gcc -O2 /tmp/recover_gz.c -I. /tmp/zlib-1.3.1/libz.a -o /tmp/recover_gz
      - name: Prepare damaged members
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'); const {execFileSync}=require('node:child_process');
          const b64=s=>{s=String(s).replace(/^\uFEFF/,'').replace(/[\s\u200B\u200C\u200D]/g,'').replace(/-/g,'+').replace(/_/g,'/').replace(/=/g,'');if(s.length%4===1)throw new Error('bad b64 '+s.length);s+='='.repeat((4-s.length%4)%4);return Buffer.from(s,'base64')};
          fs.writeFileSync('/tmp/seg01.gz',b64(fs.readFileSync('app-segment-01.txt','utf8')));
          fs.writeFileSync('/tmp/seg08.gz',b64(fs.readFileSync('app-segment-08.txt','utf8')));
          fs.writeFileSync('/tmp/seg05.gz',b64(execFileSync('git',['show','78f0a68ae9:app-segment-05.txt'],{encoding:'utf8'})));
          NODE
      - name: Recover and analyze
        run: |
          set +e
          : > recovery-report.txt
          for n in 01 05 08; do
            /tmp/recover_gz /tmp/seg$n.gz recovered-seg$n.js >> recovery-report.txt 2>&1
            echo "exit=$? segment=$n size=$(wc -c < recovered-seg$n.js 2>/dev/null || echo 0)" >> recovery-report.txt
          done
          echo '=== REPORT ==='; cat recovery-report.txt
          set -e
          node <<'NODE'
          const fs=require('node:fs');
          for(const n of ['01','05','08']){
            const p=`recovered-seg${n}.js`; if(!fs.existsSync(p))continue; const s=fs.readFileSync(p,'utf8');
            let syntax='FAIL'; try{new Function(s);syntax='PASS'}catch(e){syntax=e.message}
            console.log(`SEG${n}: chars=${s.length} syntax=${syntax} head=${JSON.stringify(s.slice(0,120))}`)
          }
          NODE
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: zlib-recovery-diagnostics
          path: |
            recovery-report.txt
            recovered-seg*.js
          if-no-files-found: error
