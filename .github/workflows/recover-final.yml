name: FINAL RECOVERY - MUTAGENÊSES

on:
  push:
    branches: [recovery/diagnose-segments]
    paths-ignore:
      - recovery-results/**
      - recovered-app.js
      - recovery-manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test historical app-part combinations
        run: |
          set -euo pipefail
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const fs=require('node:fs');
          const zlib=require('node:zlib');
          const crypto=require('node:crypto');
          const sh=a=>execFileSync('git',a,{encoding:'utf8'}).trim();
          const clean=s=>String(s).replace(/^\uFEFF/,'').replace(/[\s\u200B\u200C\u200D]/g,'').replace(/-/g,'+').replace(/_/g,'/');
          function dec(s){s=clean(s);if(!s||!/^[A-Za-z0-9+/]*={0,2}$/.test(s)||s.length%4===1)return null;if(s.length%4)s+='='.repeat(4-s.length%4);return Buffer.from(s,'base64');}
          const candidates=[];
          for(let i=1;i<=8;i++){
            const file=`app-part-${String(i).padStart(2,'0')}.txt`;
            const commits=sh(['log','--all','--format=%H','--',file]).split(/\s+/).filter(Boolean);
            const map=new Map();
            for(const c of commits){
              let blob;try{blob=sh(['rev-parse',`${c}:${file}`]);}catch{continue}
              if(map.has(blob))continue;
              let text;try{text=sh(['show',`${c}:${file}`]);}catch{continue}
              const bytes=dec(text);if(bytes)map.set(blob,{blob,commit:c,bytes,chars:clean(text).length});
            }
            candidates.push([...map.values()]);
          }
          let tested=0,found=null;const pick=[];
          function rec(i){
            if(found)return;
            if(i===8){
              tested++;
              const raw=Buffer.concat(pick.map(x=>x.bytes));
              if(raw[0]!==0x1f||raw[1]!==0x8b)return;
              try{const out=zlib.gunzipSync(raw).toString('utf8');new Function(out);found={raw,out,parts:pick.map(x=>({...x,bytes:undefined}))};}catch{}
              return;
            }
            for(const x of candidates[i]){pick.push(x);rec(i+1);pick.pop();if(found)return;}
          }
          rec(0);
          fs.mkdirSync('recovery-results',{recursive:true});
          const result=found?{found:true,tested,sourceChars:found.out.length,sha256:crypto.createHash('sha256').update(found.out).digest('hex'),parts:found.parts}: {found:false,tested,candidateCounts:candidates.map(x=>x.length)};
          fs.writeFileSync('recovery-results/final.json',JSON.stringify(result,null,2)+'\n');
          if(found){fs.writeFileSync('recovered-app.js',found.out,'utf8');fs.writeFileSync('recovery-manifest.json',JSON.stringify(result,null,2));}
          console.log(JSON.stringify(result,null,2));
          NODE
      - name: Commit recovery result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery-results/final.json recovered-app.js recovery-manifest.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'recovery: record final app-part reconstruction'
          git push
