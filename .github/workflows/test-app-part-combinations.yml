name: Test app-part combinations

on:
  push:
    branches: [recovery/diagnose-segments]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Brute force historical app-part combinations
        run: |
          set -euo pipefail
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const zlib=require('node:zlib');
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const sh=a=>execFileSync('git',a,{encoding:'utf8'}).trim();
          const clean=s=>String(s).replace(/^\uFEFF/,'').replace(/[\s\u200B\u200C\u200D]/g,'').replace(/-/g,'+').replace(/_/g,'/').replace(/=/g,'');
          function decode(s){s=clean(s); if(!s||!/^[A-Za-z0-9+/]*$/.test(s)||s.length%4===1)return null; return Buffer.from(s+'='.repeat((4-s.length%4)%4),'base64');}
          const candidates=[];
          for(let i=1;i<=8;i++){
            const file=`app-part-${String(i).padStart(2,'0')}.txt`;
            const commits=sh(['log','--all','--format=%H','--',file]).split(/\s+/).filter(Boolean);
            const map=new Map();
            for(const c of commits){
              let blob; try{blob=sh(['rev-parse',`${c}:${file}`]);}catch{continue}
              if(map.has(blob))continue;
              let txt; try{txt=execFileSync('git',['show',`${c}:${file}`],{encoding:'utf8'});}catch{continue}
              const b=decode(txt); if(!b)continue;
              map.set(blob,{blob,commit:c,text:clean(txt),bytes:b});
            }
            candidates.push([...map.values()]);
            console.log(`part ${i}: ${map.size} candidates`);
            for(const x of map.values()) console.log(`  ${x.blob} chars=${x.text.length} bytes=${x.bytes.length} head=${x.bytes.subarray(0,8).toString('hex')}`);
          }
          let tested=0, found=[]; const chosen=[];
          function test(choice, label){
            tested++;
            const raw=Buffer.concat(choice.map(x=>x.bytes));
            if(raw[0]!==0x1f||raw[1]!==0x8b)return;
            try{
              const out=zlib.gunzipSync(raw);
              const source=out.toString('utf8');
              try{new Function(source);}
              catch(e){return;}
              found.push({label,raw,source,choice:[...choice]});
              console.log(`FOUND ${label}: raw=${raw.length} source=${source.length} sha=${crypto.createHash('sha256').update(out).digest('hex')}`);
            }catch{}
          }
          function rec(i){
            if(found.length) return;
            if(i===8){test(chosen,'raw-bytes');return;}
            for(const c of candidates[i]){chosen.push(c);rec(i+1);chosen.pop();if(found.length)return;}
          }
          rec(0);
          console.log(`tested=${tested} found=${found.length}`);
          if(!found.length) throw new Error('Nenhuma combinação histórica de app-part por bytes gera GZIP + JavaScript válidos.');
          const f=found[0]; fs.writeFileSync('recovered-app.js',f.source); fs.writeFileSync('recovery-manifest.json',JSON.stringify(f.choice.map((x,i)=>({part:i+1,blob:x.blob,commit:x.commit,chars:x.text.length,bytes:x.bytes.length})),null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-app-part-combination
          path: |
            recovered-app.js
            recovery-manifest.json
