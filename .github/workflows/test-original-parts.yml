name: Test original app parts

on:
  push:
    branches: [recovery/diagnose-segments]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reconstruct exact original payload
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const zlib = require('node:zlib');
          const fs = require('node:fs');

          const sources = {
            1: ['9e3e9f6dadd1b7024dcd78ffc75da35da6a50165', 'app-part-01.txt'],
            2: ['f9990d52817b0e0cae2f1b534b94bc5ef15a95a6', 'app-part-02.txt'],
            3: ['c7ccd9e2cd2349b99f0fbc905b276d84f9f39996', 'app-part-03.txt'],
            4: ['457db1ea7d82199ed73d68ac5ff536995fff8aee', 'app-part-04.txt'],
            5: ['24934ad901f2a8536e85ab005f695e0f8ac7bc76', 'app-part-05.txt'],
            6: ['99036256a9277a798f05c5f1f25b074848448148', 'app-part-06.txt'],
            7: ['54467ebfe0efec6588f6faa63f60f25f0d565a08', 'app-part-07.txt'],
            8: ['e370e02d5a8c9f2afc63e711e33acfc3cbfbecc1', 'app-part-08.txt']
          };

          function show(commit,file){return execFileSync('git',['show',`${commit}:${file}`],{encoding:'utf8'});}
          function clean(s){return String(s).replace(/^\uFEFF/,'').replace(/[\s\u200B\u200C\u200D]/g,'').replace(/-/g,'+').replace(/_/g,'/').replace(/=/g,'');}

          const parts=[];
          for(let i=1;i<=8;i++){
            const [commit,file]=sources[i];
            const text=clean(show(commit,file));
            console.log(`part ${i}: ${text.length} Base64 chars from ${commit}`);
            parts.push(text);
          }

          const merged=parts.join('');
          console.log(`TOTAL: ${merged.length} Base64 chars; mod4=${merged.length%4}`);
          if(merged.length%4===1) throw new Error('Fluxo Base64 final inválido.');
          const padded=merged+'='.repeat((4-merged.length%4)%4);
          const raw=Buffer.from(padded,'base64');
          console.log(`RAW: ${raw.length} bytes; signature=${raw.subarray(0,4).toString('hex')}`);
          if(raw[0]!==0x1f||raw[1]!==0x8b) throw new Error('Cabeçalho GZIP inválido.');
          const out=zlib.gunzipSync(raw);
          console.log(`GZIP PASS: ${out.length} bytes JS`);
          fs.writeFileSync('recovered-app.js',out);
          fs.writeFileSync('recovered-app.sha256',require('node:crypto').createHash('sha256').update(out).digest('hex'));
          NODE
