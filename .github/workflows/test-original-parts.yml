name: Test original app parts

on:
  push:
    branches: [recovery/diagnose-segments]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test original payload snapshots
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const zlib = require('node:zlib');
          const fs = require('node:fs');

          const snapshots = [
            'e370e02d5a8c9f2afc63e711e33acfc3cbfbecc1',
            '54467ebfe0efec6588f6faa63f60f25f0d565a08',
            '99036256a9277a798f05c5f1f25b074848448148'
          ];
          const files = Array.from({length:8},(_,i)=>`app-part-${String(i+1).padStart(2,'0')}.txt`);

          function show(commit,file){
            try{return execFileSync('git',['show',`${commit}:${file}`],{encoding:'utf8'});}catch{return null;}
          }
          function clean(s){return String(s).replace(/^\uFEFF/,'').replace(/[\s\u200B\u200C\u200D]/g,'').replace(/-/g,'+').replace(/_/g,'/').replace(/=/g,'');}
          function test(commit){
            const parts=files.map(f=>show(commit,f));
            if(parts.some(x=>x===null)){console.log(`SNAPSHOT ${commit}: incomplete`);return false;}
            const cleaned=parts.map(clean);
            console.log(`SNAPSHOT ${commit}: sizes=${cleaned.map(x=>x.length).join(',')} total=${cleaned.join('').length}`);

            const merged=cleaned.join('');
            if(merged.length%4!==1){
              const padded=merged+'='.repeat((4-merged.length%4)%4);
              const raw=Buffer.from(padded,'base64');
              console.log(`  merged: raw=${raw.length} sig=${raw.subarray(0,4).toString('hex')}`);
              try{const out=zlib.gunzipSync(raw);console.log(`  merged GZIP PASS: out=${out.length}`);fs.writeFileSync(`bundle-${commit.slice(0,7)}.js`,out);return true;}catch(e){console.log(`  merged GZIP FAIL: ${e.message}`);}
            } else console.log('  merged: Base64 length mod 4 = 1');

            const decoded=cleaned.map(s=>{if(s.length%4===1)return null;const p=s+'='.repeat((4-s.length%4)%4);return Buffer.from(p,'base64');});
            if(decoded.every(Boolean)){
              const raw=Buffer.concat(decoded);console.log(`  per-part: raw=${raw.length} sig=${raw.subarray(0,4).toString('hex')}`);
              try{const out=zlib.gunzipSync(raw);console.log(`  per-part GZIP PASS: out=${out.length}`);return true;}catch(e){console.log(`  per-part GZIP FAIL: ${e.message}`);}
            }
            return false;
          }

          let any=false; for(const c of snapshots) any ||= test(c);
          if(!any) process.exitCode=1;
          NODE
