name: Test original app parts

on:
  push:
    branches: [recovery/diagnose-segments]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Find a valid historical payload combination
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const zlib = require('node:zlib');
          const fs = require('node:fs');

          const names = Array.from({length:8}, (_,i)=>`app-part-${String(i+1).padStart(2,'0')}.txt`);
          const candidates = [];

          function sh(args){ return execFileSync('git', args, {encoding:'utf8'}).trim(); }
          function clean(s){ return String(s).replace(/^\uFEFF/,'').replace(/[\s\u200B\u200C\u200D]/g,''); }

          for(let i=0;i<8;i++){
            const commits=sh(['log','--all','--format=%H','--',names[i]]).split(/\s+/).filter(Boolean);
            const byBlob=new Map();
            for(const commit of commits){
              let blob;
              try{ blob=sh(['rev-parse',`${commit}:${names[i]}`]); }catch{ continue; }
              if(byBlob.has(blob)) continue;
              let text;
              try{ text=clean(sh(['show',`${commit}:${names[i]}`])); }catch{ continue; }
              if(text && /^[A-Za-z0-9+/=]+$/.test(text)) byBlob.set(blob,{blob,commit,text});
            }
            candidates.push([...byBlob.values()]);
            console.log(`part ${i+1}: ${byBlob.size} unique candidates`);
          }

          if(candidates.some(x=>x.length===0)) throw new Error('Algum app-part não possui candidatos históricos.');

          // O primeiro fragmento de uma stream GZIP/Base64 válida começa com H4sI.
          candidates[0].splice(0,candidates[0].length,...candidates[0].filter(x=>x.text.startsWith('H4sI')));
          console.log(`part 1 after gzip-prefix filter: ${candidates[0].length}`);

          let tested=0;
          let found=null;
          const chosen=[];
          function rec(i,mod4){
            if(found) return;
            if(i===8){
              tested++;
              if(mod4!==0) return;
              const merged=chosen.map(x=>x.text).join('');
              if(merged.length%4!==0) return;
              const raw=Buffer.from(merged,'base64');
              if(raw.length<2 || raw[0]!==0x1f || raw[1]!==0x8b) return;
              try{
                const out=zlib.gunzipSync(raw);
                if(out.length>0){ found={chosen:[...chosen],merged,raw,out}; }
              }catch{}
              return;
            }
            for(const c of candidates[i]){
              chosen.push(c);
              rec(i+1,(mod4+c.text.length)%4);
              chosen.pop();
              if(found) return;
            }
          }

          rec(0,0);
          console.log(`Combinations tested: ${tested}`);
          if(!found) throw new Error('Nenhuma combinação histórica dos app-part produz um GZIP válido.');

          console.log('FOUND VALID COMBINATION:');
          found.chosen.forEach((x,i)=>console.log(`  part ${i+1}: commit=${x.commit} blob=${x.blob} len=${x.text.length}`));
          console.log(`VALID payload: ${found.merged.length} Base64 chars; ${found.raw.length} gzip bytes; ${found.out.length} JS bytes.`);
          fs.writeFileSync('recovered-app.js',found.out);
          fs.writeFileSync('recovered-parts.json',JSON.stringify(found.chosen.map(x=>({commit:x.commit,blob:x.blob})),null,2));
          NODE
