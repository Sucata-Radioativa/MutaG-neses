name: Test reconstruction backups

on:
  push:
    branches: [recovery/diagnose-segments]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Recover damaged gzip members from backups
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const zlib=require('node:zlib');
          const crypto=require('node:crypto');
          const {execFileSync}=require('node:child_process');
          const sh=a=>execFileSync('git',a,{encoding:'utf8'}).trim();
          const clean=s=>String(s).replace(/^\uFEFF/,'').replace(/[\s\u200B\u200C\u200D]/g,'').replace(/-/g,'+').replace(/_/g,'/');
          const read=(p)=>fs.readFileSync(p,'utf8');
          function test(name,b64){
            let s=clean(b64); if(!s||!/^[A-Za-z0-9+/]*$/.test(s)||s.length%4===1)return null;
            s+='='.repeat((4-s.length%4)%4);
            const raw=Buffer.from(s,'base64'); if(raw[0]!==0x1f||raw[1]!==0x8b)return null;
            try{return {name,raw,source:zlib.gunzipSync(raw).toString('utf8')}}catch{return null}
          }
          function candidateList(seg){
            const out=[]; const add=(name,s)=>{const x=test(name,s);console.log(`${name}: ${x?'VALID '+x.raw.length+' bytes':'invalid'} chars=${clean(s).length}`);if(x)out.push(x)};
            const f=`app-segment-${String(seg).padStart(2,'0')}.txt`;
            add(`seg${seg}-current`,read(f));
            if(seg===1){
              const r=[1,2,3,4,5].map(i=>read(`_rebuild/seg01-0${i}.txt`)).join(''); add('seg1-rebuild',r);
              const p=['seg01-1.txt','seg01-2.txt','seg01-3.txt'].map(x=>read(`_pristine/${x}`)).join(''); add('seg1-pristine',p);
              for(const [c,file] of [['c642dd6aec',f],['296e8935b3',f]]){try{add(`seg1-hist-${c}`,sh(['show',`${c}:${file}`]))}catch{}}
            }
            if(seg===5){
              const p=['seg05-1.txt','seg05-2.txt','seg05-3.txt'].map(x=>read(`_pristine/${x}`)).join(''); add('seg5-pristine',p);
              for(const [c,file] of [['bf6225a5da',f],['e37ff1a816',f],['78f0a68ae9',f]]){try{add(`seg5-hist-${c}`,sh(['show',`${c}:${file}`]))}catch{}}
            }
            if(seg===8){
              const p=['seg08-1.txt','seg08-2.txt','seg08-3.txt'].map(x=>read(`_pristine/${x}`)).join(''); add('seg8-pristine',p);
              for(const [c,file] of [['bae3b97235',f],['750a71ece8',f]]){try{add(`seg8-hist-${c}`,sh(['show',`${c}:${file}`]))}catch{}}
            }
            return out;
          }

          const cand={1:candidateList(1),5:candidateList(5),8:candidateList(8)};
          const fixed={}; for(let i=2;i<=7;i++){const x=test(`seg${i}`,read(`app-segment-${String(i).padStart(2,'0')}.txt`));if(!x)throw new Error(`segment ${i} is invalid`);fixed[i]=x;}
          console.log(`Candidates valid: 1=${cand[1].length} 5=${cand[5].length} 8=${cand[8].length}`);
          let found=null;
          for(const a of cand[1])for(const e of cand[5])for(const h of cand[8]){
            const source=[a.source,fixed[2].source,fixed[3].source,fixed[4].source,e.source,fixed[6].source,fixed[7].source,h.source].join('');
            try{new Function(source); found={a,e,h,source}; break}catch{}
          }
          if(!found)throw new Error('Nenhuma combinação de reconstruções conhecidas produziu JavaScript válido.');
          const sha=crypto.createHash('sha256').update(found.source).digest('hex');
          console.log(`FOUND ${found.source.length} chars SHA256=${sha}`);
          console.log(JSON.stringify({seg1:found.a.name,seg5:found.e.name,seg8:found.h.name},null,2));
          fs.writeFileSync('app-core.js',found.source);
          fs.writeFileSync('recovery-manifest.json',JSON.stringify({sha256:sha,seg1:found.a.name,seg5:found.e.name,seg8:found.h.name},null,2));
          NODE
          node --check app-core.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-core.js recovery-manifest.json
          git commit -m 'recovery: restore validated application source'
          git push origin recovery/diagnose-segments
