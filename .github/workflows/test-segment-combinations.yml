name: Test segment combinations

on:
  push:
    branches: [recovery/diagnose-segments]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Find valid segmented gzip stream
        run: |
          node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const zlib = require('node:zlib');
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          function sh(args){ return execFileSync('git', args, {encoding:'utf8'}).trim(); }
          function clean(s){
            return String(s)
              .replace(/^\uFEFF/,'')
              .replace(/[\s\u200B\u200C\u200D]/g,'')
              .replace(/-/g,'+')
              .replace(/_/g,'/')
              .replace(/=/g,'');
          }
          function decodeMerged(text){
            const s=clean(text);
            if(!s || !/^[A-Za-z0-9+/]*$/.test(s) || s.length%4===1) return null;
            const padded=s+'='.repeat((4-s.length%4)%4);
            try { return Buffer.from(padded,'base64'); } catch { return null; }
          }

          const candidates=[];
          for(let n=1;n<=8;n++){
            const file=`app-segment-${String(n).padStart(2,'0')}.txt`;
            const commits=sh(['log','--all','--format=%H','--',file]).split(/\s+/).filter(Boolean);
            const byBlob=new Map();
            for(const commit of commits){
              let blob;
              try { blob=sh(['rev-parse',`${commit}:${file}`]); } catch { continue; }
              if(byBlob.has(blob)) continue;
              let text;
              try { text=clean(execFileSync('git',['show',`${commit}:${file}`],{encoding:'utf8'})); } catch { continue; }
              if(!text || !/^[A-Za-z0-9+/]*$/.test(text)) continue;
              byBlob.set(blob,{blob,commit,text});
            }
            candidates.push([...byBlob.values()]);
            console.log(`segment ${n}: ${candidates[n-1].length} unique blobs`);
          }

          let tested=0, found=null;
          const chosen=[];
          function rec(i){
            if(found) return;
            if(i===8){
              tested++;
              const merged=chosen.map(x=>x.text).join('');
              const raw=decodeMerged(merged);
              if(!raw || raw.length<2 || raw[0]!==0x1f || raw[1]!==0x8b) return;
              try{
                const source=zlib.gunzipSync(raw).toString('utf8');
                if(!source.trim()) return;
                new Function(source);
                found={chosen:[...chosen],source,raw,merged};
              }catch{}
              return;
            }
            for(const c of candidates[i]){
              chosen.push(c);
              rec(i+1);
              chosen.pop();
              if(found) return;
            }
          }
          rec(0);
          console.log(`Combinations tested: ${tested}`);
          if(!found) throw new Error('Nenhuma combinação histórica forma um GZIP + JavaScript válido.');

          console.log('FOUND:');
          found.chosen.forEach((x,i)=>console.log(`segment ${i+1}: blob=${x.blob} commit=${x.commit} chars=${x.text.length}`));
          const digest=crypto.createHash('sha256').update(found.source).digest('hex');
          console.log(`Recovered JS: ${found.source.length} chars; gzip=${found.raw.length} bytes; Base64=${found.merged.length}; SHA256=${digest}`);
          fs.writeFileSync('recovered-segmented-app.js',found.source,'utf8');
          fs.writeFileSync('recovery-manifest.json',JSON.stringify(found.chosen.map((x,i)=>({segment:i+1,blob:x.blob,commit:x.commit})),null,2));
          NODE
